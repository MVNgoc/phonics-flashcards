<!doctype html>
<html lang="vi">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Phonics Flashcard</title>
    <script>
      // Set theme class BEFORE React mounts to avoid a flash of the wrong theme.
      (function () {
        try {
          var saved = localStorage.getItem('phonics-flashcard:theme')
          var dark =
            saved === 'dark' ||
            (saved === null && window.matchMedia('(prefers-color-scheme: dark)').matches)
          if (dark) document.documentElement.classList.add('dark')
        } catch (e) {}
      })()
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
